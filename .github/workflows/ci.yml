name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  linux:
    name: Linux common + eBPF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev zlib1g-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Antivirus-Immunity/target
          key: linux-cargo-${{ hashFiles('Antivirus-Immunity/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Formatting
        working-directory: Antivirus-Immunity
        run: cargo fmt --all -- --check

      - name: Clippy common
        working-directory: Antivirus-Immunity
        run: cargo clippy --locked --package antivirus-immunity-common -- -D warnings

      - name: Clippy eBPF
        working-directory: Antivirus-Immunity
        run: cargo clippy --locked --package antivirus-immunity-ebpf -- -A dead_code -D warnings

      - name: Test common and eBPF
        working-directory: Antivirus-Immunity
        run: |
          cargo test --locked --package antivirus-immunity-common
          cargo test --locked --package antivirus-immunity-ebpf

      - name: Release build
        working-directory: Antivirus-Immunity
        run: cargo build --locked --release --package antivirus-immunity-ebpf

      - name: CLI smoke test
        working-directory: Antivirus-Immunity
        run: target/release/immunity-ebpf --help

      - uses: actions/upload-artifact@v4
        with:
          name: immunity-ebpf-linux-x86_64
          path: Antivirus-Immunity/target/release/immunity-ebpf
          if-no-files-found: error

  container:
    name: Linux container build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: Antivirus-Immunity
          file: Antivirus-Immunity/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit locked dependencies
        working-directory: Antivirus-Immunity
        run: cargo audit --deny warnings
