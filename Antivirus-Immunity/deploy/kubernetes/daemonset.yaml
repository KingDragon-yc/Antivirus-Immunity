apiVersion: v1
kind: ConfigMap
metadata:
  name: immunity-policy
  labels:
    app.kubernetes.io/name: antivirus-immunity
data:
  kernel-policy.json: |
    {
      "version": 1,
      "generation": 1,
      "fail_closed": false,
      "allow_legacy_tc": false,
      "interfaces": ["auto"],
      "network_blacklist": [],
      "blocked_ports": [],
      "protected_paths": [
        {"path":"/etc/shadow","deny":["write"],"allow_processes":[],"recursive":false},
        {"path":"/root/.ssh","deny":["write"],"allow_processes":[],"recursive":true}
      ]
    }
  threat-intel.json: |
    {"version":1,"threshold":80,"max_file_bytes":67108864,"entries":[]}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: antivirus-immunity
  labels:
    app.kubernetes.io/name: antivirus-immunity
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: antivirus-immunity
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: antivirus-immunity
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      hostPID: true
      hostNetwork: true
      automountServiceAccountToken: false
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 15
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      containers:
        - name: immunity-ebpf
          image: ghcr.io/kingdragon-yc/antivirus-immunity:v0.7.0
          imagePullPolicy: IfNotPresent
          args:
            - --mode
            - monitor
            - --profile
            - container
            - --ai
            - "false"
            - --metrics-listen
            - 0.0.0.0:9090
            - --kernel-policy
            - /etc/immunity/kernel-policy.json
            - --threat-intel
            - /etc/immunity/threat-intel.json
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: policy
              mountPath: /etc/immunity
              readOnly: true
            - name: state
              mountPath: /var/lib/immunity
            - name: securityfs
              mountPath: /sys/kernel/security
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: immunity-policy
        - name: state
          hostPath:
            path: /var/lib/antivirus-immunity
            type: DirectoryOrCreate
        - name: securityfs
          hostPath:
            path: /sys/kernel/security
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: antivirus-immunity-metrics
  labels:
    app.kubernetes.io/name: antivirus-immunity
spec:
  selector:
    app.kubernetes.io/name: antivirus-immunity
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
