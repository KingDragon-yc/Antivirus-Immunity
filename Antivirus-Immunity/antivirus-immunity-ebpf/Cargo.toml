[package]
name = "antivirus-immunity-ebpf"
version = "0.5.0"
edition = "2024"
rust-version = "1.91"
description = "eBPF-based cloud-native Linux security engine for Antivirus-Immunity"
authors = ["KingDragon-yc"]

# This crate is Linux-only. The eBPF probes (C code) are compiled separately
# via libbpf/clang and loaded at runtime.

[dependencies]
antivirus-immunity-common = { path = "../antivirus-immunity-common" }

tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.31", features = ["process", "signal", "user", "fs", "socket"] }
libc = "0.2"
uuid = { version = "1.23", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
libbpf-rs = "0.26.2"

[target.'cfg(target_os = "linux")'.build-dependencies]
libbpf-cargo = "0.26.2"

[[bin]]
name = "immunity-ebpf"
path = "src/main.rs"
